# 정본 검사 — push · PR 마다. Python 만으로 도는 check-all.sh 가 본체이고,
# node 단계는 레지스트리 산출물(public/r)이 소스에서 다시 빌드한 것과 같은지만 본다.
name: check

on:
  push:
    branches: ["main", "v2-*"]
  pull_request:

jobs:
  canon:
    name: check-all (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check-all
        run: bash tools/check-all.sh

  registry:
    name: registry build is fresh (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: rebuild to temp and diff
        run: |
          npx --yes shadcn@4.19.0 build registry.json -o /tmp/r
          # 산출물이 커밋된 public/r 과 같아야 한다 — 다르면 소스를 고치고 빌드를 안 한 것이다
          diff -r /tmp/r public/r && echo "public/r 최신"
