function barChart(list=state.bills){const counts=stageNames.map((_,s)=>list.filter(b=>b.stage===s&&!b.withdrawn).length),max=Math.max(...counts,1);return `<div class="bar-chart" role="img" aria-label="${counts.map((c,i)=>['작성','연서','접수','회부','심사','본회의','이송','완료'][i]+' '+c+'건').join(', ')}">${counts.map((c,i)=>`<div class="bar-col"><span>${c}</span><div class="bar-fill" style="height:${c/max*83}px"></div><span>${['작성','연서','접수','회부','심사','본회의','이송','완료'][i]}</span></div>`).join('')}</div>`}

return pageHead('LEGISLATIVE STUDIO / '+esc(b.id),esc(b.title),`${badge(b)} &nbsp; ${esc(b.owner)} &nbsp; · &nbsp; ${esc(b.committee)}`,`${btn(icon('eye')+(focusMode?'전체 보기':'집중 보기'),'focus','','quiet')}${btn(icon('download')+'내보내기','export-bill',b.id,'quiet')}${btn(icon('save')+'버전 저장','save-version','','primary')}`)+`<div class="tools"><select aria-label="편집할 의안" data-filter="selected" style="max-width:440px">${state.bills.map(x=>`<option value="${x.id}" ${x.id===b.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select><span id="save-status" role="status" class="count-label">이 브라우저에 자동 저장</span></div><nav class="process" aria-label="의안 처리 단계">${stageNames.map((n,i)=>btn(`<span>${i<b.stage?'✓':i+1}</span>${n}`,'stage-info',i,i===b.stage?'active':i<b.stage?'done':'')).join('')}</nav><div class="studio-grid"><div class="editor-card"><div class="editor-top"><div class="row"><strong>문서 편집</strong>${linkBtn('변경·처리 이력','studio/history','text-link')}</div><span class="tag">비공개 초안 · 예시</span></div><div class="editor-toolbar" role="toolbar" aria-label="문서 서식">${btn('본문','format','p')}${btn('제목','format','h3')}<span class="sep"></span>${btn('<b>B</b>','format','bold')}${btn('<i>I</i>','format','italic')}${btn('<u>U</u>','format','underline')}${btn('• 목록','format','insertUnorderedList')}${btn('표','insert-table')}<span class="sep"></span>${btn('↶','format','undo')}${btn('↷','format','redo')}<span class="spacer"></span>${btn(icon('spark')+'AI 다듬기','editor-ai','','text-link')}</div><article class="paper"><div class="paper-overline"><strong>GYEONGGI ASSEMBLY</strong><span>검토용 가상 문서</span></div><h2>${esc(b.title)}</h2><p class="paper-meta">제안 설명 · ${esc(b.id)} · ${esc(b.owner)}</p><div id="editor" data-bill="${b.id}" class="editable" contenteditable="true" role="textbox" aria-label="의안 본문 편집" aria-multiline="true" spellcheck="false">${sanitize(b.content)}</div><div class="paper-end"><span>경기도의회 / 시연 문서</span><span>01</span></div></article><div class="editor-foot"><span id="word-count">${plain(b.content).length.toLocaleString()}자</span><span>실제 법령 검토·접수 없음 · 로컬 저장</span></div></div><aside class="studio-side"><section class="card side-panel"><div class="eyebrow">NEXT STEP</div><h2>${b.stage===0?'다음 절차로 가기 전,<br>세 가지만 확인하세요.':'지금 필요한 절차를<br>확인하세요.'}</h2><p>자료를 확인한 뒤 다음 단계의 처리 화면으로 이동합니다.</p><dl class="meta-list"><dt>현재 단계</dt><dd>${stageNames[b.stage]}</dd><dt>다음 담당</dt><dd>${b.stage<2?'정책지원관':'의사·위원회 담당'} · 예시</dd><dt>첨부 문서</dt><dd>${state.documents.filter(d=>d.bill===b.id&&!d.deleted).length}건 ${btn('자료 연결','attach-doc',b.id,'text-link')}</dd></dl><div class="rule"></div>${['제안 이유·주요 내용 확인','관계 법령·검토 자료 확인','비용추계·필수 첨부 확인'].map((l,i)=>`<label class="check"><input type="checkbox" data-check="${i}" ${b.checks[i]?'checked':''}>${l}</label>`).join('')}<div class="row between" style="margin:18px 0 9px"><small>필수 확인</small><small id="check-count">${b.checks.filter(Boolean).length} / 3</small></div><div class="progress"><i id="check-progress" style="width:${b.checks.filter(Boolean).length/3*100}%"></i></div><div style="margin-top:20px">${btn('다음 절차 확인 '+icon('arrow'),'next-process',b.id,'primary full')}</div><p style="font-size:10px;margin-top:12px">단계 변경은 시연 기록에만 반영됩니다. 실제 발의·서명·결재는 실행하지 않습니다.</p></section><section class="card side-panel" style="margin-top:17px"><div class="row between"><h3>작성을 돕는 AI</h3>${icon('spark')}</div><p style="margin:10px 0 16px">현재 문서를 바탕으로 요약·공문체 변경 예시를 확인하세요.</p>${btn('제안 문장 비교하기','editor-ai','','full')}<p style="font-size:9px;margin-top:10px">AI 미연결 · 예시 규칙 기반 · 검토 후 반영</p></section></aside></div>`}
function plain(html){const div=document.createElement('div');div.innerHTML=html;return div.textContent||''}
function sanitize(html){const div=document.createElement('div');div.innerHTML=String(html);div.querySelectorAll('script,style,iframe,object,embed,link,meta,form,input,button,img,svg,math').forEach(e=>e.remove());div.querySelectorAll('*').forEach(e=>{[...e.attributes].forEach(a=>{if(!['colspan','rowspan'].includes(a.name))e.removeAttribute(a.name)})});return div.innerHTML}
function saveEditor(version=false){const e=$('#editor');if(!e)return;const b=state.bills.find(x=>x.id===e.dataset.bill)||bill();b.content=sanitize(e.innerHTML);b.updated=new Date().toISOString().slice(0,10);if(version){b.versions.unshift({at:stamp(),content:b.content});b.versions=b.versions.slice(0,12);b.history.unshift({at:stamp(),action:'문서 버전 저장',detail:'작성자: 김담당 · 현재 본문을 새 버전으로 보관'});log('의안 문서 저장',b.title)}const ok=persist();if($('#save-status'))$('#save-status').textContent=ok?'로컬 저장됨 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}):'저장 실패 · 백업 필요';if($('#word-count'))$('#word-count').textContent=plain(b.content).length.toLocaleString()+'자';if(version)toast('현재 문서를 새 버전으로 저장했습니다.')}

function renderEndorsement(){const list=state.bills.filter(b=>b.stage===1&&!b.withdrawn&&(current.sub==='status'||(current.sub==='sent'?b.requestedByMe:!b.requestedByMe)));return pageHead('ELECTRONIC ENDORSEMENT','전자 연서','요청, 내용 확인, 서명 진행과 제출 가능 여부를 한 흐름으로 확인합니다.',btn(icon('plus')+'연서 요청 만들기','request-sign','','primary'))+subnav('endorsement')+`<div class="notice amber" style="margin-bottom:22px">전자서명·DID 인증은 연결되지 않았습니다. 아래 서명과 취소는 가상 기록입니다. 시연 정족수 3명은 실제 법적 요건이 아닙니다.</div><div class="grid3">${list.map(b=>`<article class="card card-pad"><div class="row between"><span class="tag blue">${current.sub==='sent'?'보낸 요청':'연서 진행'}</span><small>${b.id}</small></div><h2 style="font-size:17px;margin:18px 0 10px;min-height:52px">${esc(b.title)}</h2><p class="muted" style="font-size:11px">${esc(b.owner)} · ${esc(b.committee)}</p><div class="rule"></div><div class="row between"><small>시연 정족수</small><strong>${b.signers.length} / 3명</strong></div><div class="progress" style="margin:10px 0 15px"><i style="width:${Math.min(100,b.signers.length/3*100)}%"></i></div><p class="muted" style="font-size:10px;min-height:32px">${b.signers.length?b.signers.map(esc).join(' · '):'아직 등록된 연서가 없습니다.'}</p><div class="row wrap" style="margin-top:18px">${btn('내용 확인·연서','sign-detail',b.id,'primary')}${btn('요청 관리','sign-manage',b.id,'quiet')}</div></article>`).join('')||empty('진행 중인 연서가 없습니다.','작성 중인 의안에서 연서 요청을 만들 수 있습니다.')}</div>`}
const workflowInfo={receipt:{title:'접수 관리',desc:'제출 서류를 확인하고 접수번호와 담당자를 기록합니다.',stages:[2],action:'접수 검토'},report:{title:'의장보고',desc:'접수된 의안의 보고와 내부 결재 상태를 관리합니다.',stages:[2,3],action:'보고 기록'},referral:{title:'소관위 회부',desc:'담당 위원회와 회부 내용을 기록합니다.',stages:[3],action:'회부 처리'},withdraw:{title:'발의·철회 관리',desc:'발의서 조회와 단계별 철회 동의·확인 내역을 기록합니다.',stages:[0,1,2,3,4,5,6,7],action:'발의·철회'},review:{title:'위원회 심사',desc:'심사 결과, 수정안과 후속 보고를 의안에 연결합니다.',stages:[4],action:'심사 결과'},notice:{title:'입법예고',desc:'예고 기간과 의견수렴 내용의 공개 시연을 관리합니다.',stages:[3,4,5],action:'예고 설정'},reports:{title:'심사보고서',desc:'심사보고서와 회의록을 연결하고 제출 이력을 남깁니다.',stages:[4,5],action:'보고서 연결'},agenda:{title:'본회의 심의',desc:'상정, 표결 결과와 공개 여부를 기록합니다.',stages:[5],action:'의결 결과'},transfer:{title:'단체장 이송',desc:'의결된 의안의 이송 대상과 이송문서를 확인합니다.',stages:[6],action:'이송 처리'},promulgation:{title:'공포 관리',desc:'이송 이후 공포일과 시행일을 기록합니다.',stages:[6,7],action:'공포 기록'},reconsider:{title:'재의 관리',desc:'의결사항 확인, 재의요구 접수와 재의결을 연결합니다.',stages:[5,6,7],action:'재의 기록'},litigation:{title:'제소 관리',desc:'재의결 관련 제소 사건과 처리 경과를 기록합니다.',stages:[5,6,7],action:'제소 기록'}};
function renderWorkflow(){const cfg=workflowInfo[current.sub]||workflowInfo.receipt,list=state.bills.filter(b=>cfg.stages.includes(b.stage)&&(current.sub==='withdraw'||!b.withdrawn));return pageHead('CONNECTED LEGISLATIVE PROCESS',cfg.title,cfg.desc,btn(icon('download')+'목록 내보내기','export-workflow','','quiet'))+subnav(current.section)+`<div class="tools"><div class="chips"><span class="tag green-tag">해당 단계 ${list.length}건</span><span class="tag">가상 업무 처리</span></div>${linkBtn('전체 의안 조회 →','bills','text-link')}</div><section class="card">${list.length?`<div class="table-wrap"><table><thead><tr><th>의안명 / 담당</th><th>처리 상태</th><th>문서·기록</th><th>다음 행동</th></tr></thead><tbody>${list.map(b=>`<tr><td>${btn(esc(b.title),'bill-detail',b.id,'title-link')}<small>${b.id} · ${esc(b.committee)}</small></td><td>${badge(b)}<small>${esc(b.receipt||'접수번호 미부여')}</small></td><td>${state.documents.filter(d=>d.bill===b.id&&!d.deleted).length}개 문서<small>${b.history.length}개 처리 이력</small></td><td>${btn(cfg.action,'workflow-action',b.id,'quiet primary')}</td></tr>`).join('')}</tbody></table></div>`:empty('이 단계에 처리할 의안이 없습니다.','앞 단계에서 의안을 처리하면 이 목록에 표시됩니다.')}</section><div class="notice" style="margin-top:20px">실서비스에서는 의안 유형별 법정 절차·정족수·기한·권한 및 결재선을 검증해야 합니다. 이 화면은 로컬 상태 전환과 기록 관리만 시연합니다.</div>`}
function filterBills(){return state.bills.filter(b=>(statusFilter==='all'||String(b.stage)===statusFilter)&&(!query||[b.title,b.id,b.owner,b.committee,plain(b.content)].some(v=>v.toLowerCase().includes(query.toLowerCase())))).filter(b=>current.section!=='bills'||current.sub==='all'||(current.sub==='pending'?b.stage<7&&!b.withdrawn:b.stage===7||b.withdrawn))}
function renderBills(){if(current.sub==='petitions')return pageHead('PETITIONS','청원 현황','공개 청원의 검토·위원회 처리·결과 이력을 확인합니다.',btn(icon('plus')+'청원 기록 추가','new-petition','','primary'))+subnav('bills')+renderPetitionTable();return pageHead('BILL EXPLORER','의안 현황·조회','의안의 내용과 처리 과정, 연결 문서를 함께 살펴보세요.',btn(icon('download')+'CSV 내보내기','export-bills','','quiet'))+subnav('bills')+`<div class="tools"><div class="filters"><input class="search-input" data-filter="bills" placeholder="의안명·본문·의원·위원회 검색" aria-label="의안 검색"><select data-filter="stage" aria-label="상태 필터"><option value="all">모든 단계</option>${stageNames.map((n,i)=>`<option value="${i}">${n}</option>`).join('')}</select></div><small id="result-count">${filterBills().length}건</small></div><section id="bill-results" class="card">${billRows(filterBills(),'bill-detail')}</section>`}
function renderPetitionTable(){return `<section class="card"><div class="table-wrap"><table><thead><tr><th>제목</th><th>구분</th><th>상태</th><th>등록일</th><th>관리</th></tr></thead><tbody>${state.petitions.map(p=>`<tr><td>${btn(esc(p.title),'petition-detail',p.id,'title-link')}</td><td>${esc(p.category)}</td><td><span class="tag blue">${esc(p.status)}</span></td><td>${p.date}</td><td>${btn('상세·처리','petition-detail',p.id,'quiet')}</td></tr>`).join('')}</tbody></table></div></section>`}
const folderNames={personal:'개인 문서함',department:'부서 문서함',common:'공통·업무',collaboration:'협업·공유',approval:'결재·반출',archive:'보존 기록'};
function filteredDocs(){const sub=current.sub;return state.documents.filter(d=>sub==='trash'?d.deleted:!d.deleted).filter(d=>['all','trash'].includes(sub)||sub==='favorite'&&d.favorite||d.folder===sub).filter(d=>!docQuery||(d.title+' '+d.text+' '+d.owner).toLowerCase().includes(docQuery.toLowerCase()))}
function docCards(list){return list.length?`<div class="grid3">${list.map(d=>`<article class="card document-card"><div class="row between"><div class="document-icon">${esc(d.kind)}</div>${btn(icon('star'),'doc-star',d.id,'ghost quiet '+(d.favorite?'green-tag':''))}</div><div><h3>${esc(d.title)}</h3><p style="margin-top:8px">${esc(folderNames[d.folder]||d.folder)} · v${d.version}</p><p>${esc(d.owner)} · ${d.date}</p></div><div class="row"><span class="tag">${d.deleted?'휴지통':d.checkedOut?'체크아웃':'열람 가능'}</span>${d.bill?'<span class="tag green-tag">의안 연결</span>':''}</div><div class="doc-actions">${btn(d.deleted?'복원':'미리보기','doc-'+(d.deleted?'restore':'view'),d.id,'quiet')}${!d.deleted?btn('관리','doc-manage',d.id,'quiet'):''}${btn(icon('download'),'doc-download',d.id,'quiet')}</div></article>`).join('')}</div>`:empty('이 문서함은 비어 있습니다.','다른 문서함을 선택하거나 문서를 등록하세요.')}
function renderDocuments(){return pageHead('ONE DOCUMENT, ONE CONTEXT','통합 문서함','의안과 자료를 연결하고, 등록부터 보존까지 문서의 흐름을 관리합니다.',`${btn(icon('plus')+'텍스트 문서','new-doc','','quiet')}${btn(icon('upload')+'파일 등록','upload-doc','','primary')}`)+subnav('documents')+`<input type="file" id="doc-upload" hidden accept=".txt,.csv,.md,.pdf,.docx,.pptx,.xlsx"><div class="tools"><div class="filters"><input class="search-input" data-filter="docs" aria-label="문서 검색" placeholder="문서명·내용·작성자 검색" value="${esc(docQuery)}"></div><span class="count-label" id="doc-count">${filteredDocs().length}개 문서</span></div><div id="document-results">${docCards(filteredDocs())}</div><div class="notice" style="margin-top:20px">로컬 파일은 1개당 600KB, 합계 약 2MB까지 등록합니다. 동일 파일은 해시로 중복 확인하며, 브라우저 저장소는 암호화 저장소가 아닙니다. 민감한 실문서는 넣지 마세요.</div>`}
function searchResults(q,kind='all'){if(!q.trim())return empty('하나의 검색으로, 업무의 맥락까지.','의안명, 문서 내용, 위원회, 일정 키워드를 입력하세요.');const l=q.toLowerCase(),items=[];if(kind==='all'||kind==='bills')state.bills.filter(b=>(b.title+b.committee+b.owner+plain(b.content)).toLowerCase().includes(l)).forEach(b=>items.push({type:'의안',title:b.title,body:b.id+' · '+b.committee+' · '+stageShort[b.stage],action:'bill-detail',id:b.id}));if(kind==='all'||kind==='docs')state.documents.filter(d=>!d.deleted&&(d.title+d.text).toLowerCase().includes(l)).forEach(d=>items.push({type:'문서',title:d.title,body:d.text.slice(0,100),action:'doc-view',id:d.id}));if(kind==='all'||kind==='meetings')state.meetings.filter(m=>(m.title+m.minutes).toLowerCase().includes(l)).forEach(m=>items.push({type:'회의',title:m.title,body:m.date+' '+m.time+' · '+m.room,action:'meeting-detail',id:m.id}));return `<div class="row between" style="margin-bottom:15px"><strong>검색 결과 ${items.length}건</strong><small>제목·본문·메타정보 통합 검색</small></div>${items.length?`<div class="stack">${items.map(x=>`<article class="card card-pad"><div class="row between"><span class="tag">${x.type}</span>${btn(icon('arrow'),x.action,x.id,'ghost quiet')}</div><h2 style="font-size:17px;margin:10px 0">${btn(esc(x.title),x.action,x.id,'title-link ghost')}</h2><p class="muted" style="font-size:11px">${esc(x.body)}</p></article>`).join('')}</div>`:empty()}`}
function renderSearch(){return pageHead('SEARCH WITH CONTEXT','흩어진 자료를, 하나의 맥락으로.','의안·문서·회의 기록에서 필요한 정보를 찾아보세요.')+`<div class="card card-pad" style="margin-bottom:23px"><div class="row"><input id="global-search" aria-label="통합 검색어" placeholder="예: 생활이동, 비용추계, 위원회" style="flex:1" value="${esc(query)}"><select id="search-kind" aria-label="검색 범위"><option value="all">전체</option><option value="bills">의안</option><option value="docs">문서</option><option value="meetings">회의</option></select>${btn(icon('search')+'검색','search-go','','primary')}</div><div class="chips" style="margin-top:13px">${['생활이동','비용추계','공공시설'].map(s=>btn(s,'search-preset',s,'quiet')).join('')}</div></div><div id="search-results">${searchResults(query)}</div>`}
function renderStats(){return pageHead('LEGISLATIVE INSIGHT','숫자에 담긴 의정의 흐름','실제 기관 통계가 아닌 현재 로컬 작업공간의 데이터를 집계합니다.',btn(icon('download')+'통계 CSV','export-stats','','quiet'))+`<div class="tools"><div class="filters"><label class="row">시작일 <input id="stats-from" type="date" aria-label="통계 시작일"></label><label class="row">종료일 <input id="stats-to" type="date" aria-label="통계 종료일"></label><select id="stats-committee" aria-label="통계 위원회"><option value="all">전체 위원회</option>${committees.map(c=>`<option>${c}</option>`).join('')}</select>${btn('조회','stats-filter','','primary')}</div></div><div id="stats-results">${statsContent(state.bills)}</div>`}
function statsContent(list){const complete=list.filter(b=>b.stage===7&&!b.withdrawn),withd=list.filter(b=>b.withdrawn);return `<div class="metrics">${metric('전체 의안',list.length,'건','선택 조건 기준','file')}${metric('처리 완료',complete.length,'건','공포·후속 단계','check')}${metric('진행 중',list.filter(b=>b.stage<7&&!b.withdrawn).length,'건','작성부터 이송까지','clock')}${metric('철회',withd.length,'건','처리 이력 보관','history')}</div><div class="grid-equal"><section class="card card-pad"><h2>단계별 분포</h2><div style="height:22px"></div>${barChart(list)}<div class="rule"></div><div class="chips">${stageNames.map((n,i)=>`<span class="tag">${n} ${list.filter(b=>b.stage===i&&!b.withdrawn).length}</span>`).join('')}</div></section><section class="card card-pad"><h2>위원회별 의안</h2><div class="stack" style="margin-top:22px">${committees.map(c=>{const count=list.filter(b=>b.committee===c).length;return `<div><div class="row between" style="font-size:11px;margin-bottom:7px"><span>${c}</span><strong>${count}건</strong></div><div class="progress"><i style="width:${list.length?count/list.length*100:0}%"></i></div></div>`}).join('')}</div></section></div><section class="card" style="margin-top:22px"><div class="card-head"><h2>의원·발의유형·연서 집계</h2><span class="tag">가상 집계</span></div><div class="table-wrap"><table><thead><tr><th>대표 발의자</th><th>전체 의안</th><th>조례안</th><th>일부개정조례안</th><th>등록 연서</th></tr></thead><tbody>${[...new Set(list.map(b=>b.owner))].map(o=>`<tr><td>${esc(o)}</td><td>${list.filter(b=>b.owner===o).length}</td><td>${list.filter(b=>b.owner===o&&b.type==='조례안').length}</td><td>${list.filter(b=>b.owner===o&&b.type==='일부개정조례안').length}</td><td>${list.filter(b=>b.owner===o).reduce((s,b)=>s+b.signers.length,0)}</td></tr>`).join('')}</tbody></table></div></section>`}
function calendarGrid(){const first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate(),total=Math.ceil((first+days)/7)*7;return `<div class="calendar">${['일','월','화','수','목','금','토'].map(d=>`<div class="weekday">${d}</div>`).join('')}${Array.from({length:total},(_,i)=>{const d=i-first+1,date=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,valid=d>0&&d<=days;return `<div class="calendar-day ${!valid?'dim':date==='2026-09-19'?'today':''}">${valid?`<span>${d}</span>${state.meetings.filter(m=>m.date===date).map(m=>btn(esc(m.time+' '+m.title),'meeting-detail',m.id)).join('')}`:''}</div>`}).join('')}</div>`}
function renderMeetings(){let content='';if(current.sub==='calendar')content=`<div class="tools"><div class="row">${btn('‹','month','-1','quiet')}<h2>${year}년 ${month+1}월</h2>${btn('›','month','1','quiet')}</div>${btn('예시 일정월','month','reset','quiet')}</div>${calendarGrid()}`;else content=`<div class="stack">${state.meetings.map(m=>`<article class="card card-pad"><div class="row between"><div><span class="eyebrow">${m.date} / ${m.time}</span><h2 style="margin:8px 0">${esc(m.title)}</h2><p class="muted" style="font-size:11px">${esc(m.room)} · 참석 ${m.attendance}명 · 자료 열람 ${m.read}명</p></div>${btn(current.sub==='minutes'?'회의록 편집':'자료 확인','meeting-detail',m.id,'primary')}</div>${current.sub==='minutes'?`<div class="source">${esc(m.minutes.slice(0,150))}</div>`:''}</article>`).join('')}</div>`;return pageHead('MEETINGS & AGENDA','회의와 일정','안건, 자료, 회의록을 하나의 일정에 연결합니다.',btn(icon('plus')+'일정 등록','new-meeting','','primary'))+subnav('meetings')+content}

let modalAction=null,modalTarget=null;
function openDialog(title,body,label='',action=null,wide=false){lastFocus=document.activeElement;modalAction=action;const d=$('#dialog');d.classList.toggle('wide-dialog',wide);d.innerHTML=`<div class="dialog-header"><h2 id="dialog-title">${title}</h2>${btn(icon('x'),'close','','ghost quiet')}</div><div class="dialog-body">${body}</div><div class="dialog-actions">${btn('닫기','close')}${label?btn(label,'modal-submit','','primary'):''}</div>`;d.querySelector('[data-action="close"]').setAttribute('aria-label','대화상자 닫기');if(!d.open)d.showModal();setTimeout(()=>d.querySelector('input:not([type=checkbox]),textarea,select,button')?.focus(),0)}
function closeDialog(){const d=$('#dialog');d.close();modalAction=null;lastFocus?.isConnected&&lastFocus.focus()}
function field(name,label,value='',type='text',required=true){return `<label class="field ${type==='textarea'?'wide':''}"><span>${label}${required?' *':''}</span>${type==='textarea'?`<textarea id="f-${name}" ${required?'required':''} maxlength="20000">${esc(value)}</textarea>`:`<input id="f-${name}" type="${type}" value="${esc(value)}" ${required?'required':''} maxlength="500">`}</label>`}
function selectField(name,label,options,value=''){return `<label class="field"><span>${label}</span><select id="f-${name}">${options.map(o=>{const [val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${val===value?'selected':''}>${esc(lab)}</option>`}).join('')}</select></label>`}
const val=name=>$('#f-'+name)?.value.trim()||'';
function addHistory(b,action,detail){b.updated=new Date().toISOString().slice(0,10);b.history.unshift({at:stamp(),action,detail});log(action,b.title+' / '+detail);state.notifications.unshift({id:uid('n'),title:action+' · '+b.title,body:detail+' · 로컬 기록',bill:b.id,read:false});persist()}
function download(name,text,mime='text/plain;charset=utf-8'){const blob=text instanceof Blob?text:new Blob([text],{type:mime}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name.replace(/[<>:"/\\|?*]/g,'_');a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
function csv(rows){return '\ufeff'+rows.map(r=>r.map(c=>'"'+String(c??'').replace(/^([=+@\-])/,'\'$1').replace(/"/g,'""')+'"').join(',')).join('\r\n')}

function workflowAction(id){const b=state.bills.find(b=>b.id===id),sub=current.sub,cfg=workflowInfo[sub];if(!b||!cfg)return;modalTarget=id;let fields='';if(sub==='receipt')fields=selectField('decision','검토 결과',['접수 확정','보완 요청','접수 반려'])+field('receipt','접수번호',b.receipt||'접수-2026-'+b.id.split('-')[1])+field('reason','검토 의견','','textarea');if(sub==='report')fields=selectField('decision','보고·결재 결과',['의장보고 완료','내부 검토 보완'])+field('reason','보고 내용','','textarea');if(sub==='referral')fields=selectField('committee','소관 위원회',committees,b.committee)+field('date','회부일',new Date().toISOString().slice(0,10),'date')+field('reason','회부 메모','','textarea');if(sub==='review')fields=selectField('decision','위원회 심사 결과',['원안가결','수정가결','계속심사','부결','대안반영폐기'])+field('reason','심사 결과·수정 내용','','textarea');if(sub==='notice')fields=field('start','예고 시작일','2026-09-19','date')+field('end','예고 종료일','2026-09-29','date')+field('reason','공개 예고 요약','지원 대상과 절차 정비에 관한 의견을 수렴하는 가상 예시입니다.','textarea');if(sub==='reports')fields=selectField('document','연결할 문서',state.documents.filter(d=>!d.deleted).map(d=>[d.id,d.title]))+field('reason','보고 내용','','textarea');if(sub==='agenda')fields=selectField('decision','의결 결과',['원안가결','수정가결','부결','계속심의'])+field('total','재석(시연)',20,'number')+field('yes','찬성',15,'number')+field('no','반대',3,'number')+field('abstain','기권',2,'number')+selectField('visibility','공개 예시 화면 반영',[['yes','공개'],['no','비공개']])+field('reason','의결 결과 메모','','textarea');if(sub==='transfer')fields=selectField('target','이송 대상',['경기도지사 · 예시','경기도교육감 · 예시'])+field('date','이송일',new Date().toISOString().slice(0,10),'date')+field('reason','이송문서·확인사항','','textarea');if(sub==='promulgation')fields=field('number','공포번호',b.promulgation?.number||'예시-2026-001')+field('date','공포일',new Date().toISOString().slice(0,10),'date')+field('effective','시행일','2026-10-01','date')+field('reason','후속 안내','','textarea');if(sub==='reconsider')fields=selectField('decision','재의 처리 구분',['의결사항 확인','재의요구 등록','내부결재 접수','재의결 가결','재의결 부결'])+field('date','처리일',new Date().toISOString().slice(0,10),'date')+field('reason','사유 및 검토 내역','','textarea');if(sub==='litigation')fields=field('case','제소 사건번호','가상사건-2026-01')+selectField('decision','처리 상태',['제소 검토','제소 기록','심리 중','결과 확인'])+field('reason','진행 경과','','textarea');if(sub==='withdraw')fields=`<div class="field wide"><div class="row wrap">${btn('발의서 보기','proposal-view',id)}${b.stage===1?btn('발의 제출 시연','proposal-submit',id,'primary'):''}</div></div>`+field('reason','철회 사유','','textarea')+`<div class="field wide">${['의장확인 및 철회 의사 확인',...(b.stage>=4?['위원회 동의 확인']:[]),...(b.stage>=5?['본회의 동의 확인']:[])].map((t,i)=>`<label class="check"><input type="checkbox" class="withdraw-check" required>${t} · 시연</label>`).join('')}</div>`;openDialog(cfg.action+' · 로컬 시연',`<p style="font-size:13px;font-weight:bold;margin-bottom:18px">${esc(b.title)}</p><div class="form-grid">${fields}</div><div class="notice amber" style="margin-top:18px">현재 단계: ${stageNames[b.stage]}. 실제 기관 접수·보고·공개·전송이 아닌 브라우저 내부 시연입니다.</div>`,sub==='withdraw'?'철회 기록 저장':'처리 내용 저장',()=>applyWorkflow(b,sub),true)}
function applyWorkflow(b,sub){const reason=val('reason'),decision=val('decision'),before=stageNames[b.stage];if(sub==='receipt'){if(decision==='접수 확정'){if(state.bills.some(x=>x.id!==b.id&&x.receipt===val('receipt'))){toast('중복된 접수번호입니다. 다른 번호를 입력하세요.');return false}b.receipt=val('receipt');b.special='접수 완료'}else{b.stage=0;b.special=decision==='보완 요청'?'보완 중':'접수 반려'}}if(sub==='report'){if(!b.receipt){toast('접수번호 부여 후 의장보고를 진행해 주세요.');return false}if(decision==='의장보고 완료'){b.stage=3;b.special='회부 대기'}else b.special='보고 보완'}if(sub==='referral'){b.committee=val('committee');b.stage=4;b.special='심사 중';b.referred=val('date')}if(sub==='review'){b.result=decision;if(['원안가결','수정가결'].includes(decision)){b.stage=5;b.special='본회의 대기'}else if(decision==='계속심사')b.special='계속심사';else{b.stage=7;b.special=decision+' · 종결'}}if(sub==='notice'){if(val('start')>val('end')){toast('종료일이 시작일보다 빠릅니다.');return false}b.notice={start:val('start'),end:val('end'),summary:reason};b.public=true}if(sub==='reports'){const d=state.documents.find(d=>d.id===val('document'));if(!d){toast('연결할 문서를 선택해 주세요.');return false}d.bill=b.id;b.reportDoc=d.id}if(sub==='agenda'){const votes={total:Number(val('total')),yes:Number(val('yes')),no:Number(val('no')),abstain:Number(val('abstain'))};if(Object.values(votes).some(n=>!Number.isInteger(n)||n<0)||votes.total<1||votes.yes+votes.no+votes.abstain!==votes.total){toast('찬성·반대·기권 합계가 재석 인원과 같아야 합니다.');return false}b.votes=votes;b.result=decision;b.public=val('visibility')==='yes';if(decision==='계속심의'){b.stage=5;b.special=decision}else if(decision==='부결'){b.stage=7;b.special='부결 · 종결'}else{b.stage=6;b.special='이송 대기'}}if(sub==='transfer'){b.transfer={target:val('target'),date:val('date')};b.special='이송 완료 · 공포 대기'}if(sub==='promulgation'){if(b.stage===6&&!b.transfer){toast('이송 기록을 먼저 작성해 주세요.');return false}if(['부결','대안반영폐기'].some(s=>(b.result||'').includes(s))){toast('종결 의안은 공포 대상으로 처리할 수 없습니다.');return false}if(val('effective')<val('date')){toast('시행일이 공포일보다 빠릅니다. 시연 입력값을 확인해 주세요.');return false}b.stage=7;b.special='공포 완료';b.promulgation={number:val('number'),date:val('date'),effective:val('effective')};b.public=true}if(sub==='reconsider'){b.reconsider={decision,date:val('date'),reason};b.special=decision;if(decision==='재의요구 등록'||decision==='내부결재 접수')b.stage=5;if(decision==='재의결 가결')b.stage=6;if(decision==='재의결 부결')b.stage=7}if(sub==='litigation'){b.litigation={case:val('case'),status:decision,reason};b.special=decision}if(sub==='withdraw'){if(!$$('.withdraw-check').every(c=>c.checked)){toast('단계별 동의·확인을 완료해 주세요.');return false}b.withdrawn=true;b.special='철회';b.public=false}addHistory(b,(workflowInfo[sub]?.title||'의안')+' 시연 기록',`${before} → ${stageNames[b.stage]} / ${decision?decision+' / ':''}${reason}`);closeDialog();render();toast('처리 내용과 이력을 저장했습니다.')}
function docView(id){const d=state.documents.find(d=>d.id===id);if(!d)return;log('문서 열람',d.title);const content=d.text?`<pre>${esc(d.text)}</pre>`:d.kind==='PDF'&&d.data?`<iframe title="PDF 문서 미리보기" src="${d.data}" style="width:100%;height:430px;border:0"></iframe>`:`<div class="notice">${esc(d.kind)} 파일은 원본 내려받기로 확인할 수 있습니다. 이 시안은 오피스 문서를 변환하지 않습니다.</div>`;openDialog(esc(d.title),`<div class="row wrap"><span class="tag">${esc(d.kind)}</span><span class="tag">v${d.version}</span><small>${esc(folderNames[d.folder])} · ${esc(d.owner)}</small></div><div class="rule"></div>${content}<div class="rule"></div><div class="row wrap">${btn(icon('download')+'원본 내려받기','doc-download',id,'primary')}${btn('문서 관리','doc-manage',id)}${d.bill?btn('연결 의안','bill-detail',d.bill):''}</div>`,'',null,true)}

async function uploadDocument(file){if(!file)return;if(file.size>600*1024){toast('600KB 이하 파일만 등록할 수 있습니다.');return}const buf=await file.arrayBuffer(),hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',buf))].map(n=>n.toString(16).padStart(2,'0')).join('');if(state.documents.some(d=>d.hash===hash)){toast('동일한 파일이 이미 등록되어 있습니다.');return}if(state.documents.reduce((n,d)=>n+(d.size||0),0)+file.size>2*1024*1024){toast('등록 파일 합계는 2MB 이하여야 합니다.');return}const ext=file.name.split('.').pop().toUpperCase();if(!['TXT','CSV','MD','PDF','DOCX','PPTX','XLSX'].includes(ext)){toast('지원하지 않는 파일 형식입니다.');return}let data='',text='';if(['TXT','CSV','MD'].includes(ext))text=new TextDecoder().decode(buf);else data=await new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(file)});const d={id:uid('d'),title:file.name.replace(/\.[^.]+$/,''),kind:ext,folder:current.section==='documents'&&folderNames[current.sub]?current.sub:'personal',bill:'',date:new Date().toISOString().slice(0,10),owner:'김담당',version:1,favorite:false,deleted:false,hash,text,data,size:file.size};state.documents.unshift(d);if(!persist()){state.documents.shift();return}log('파일 등록',file.name+' / SHA-256 중복검사');render();toast('파일을 등록했습니다. 외부로 전송하지 않았습니다.')}

n/).slice(1).map(r=>r.split(','));text='[가상 비용추계 전년 대비 계산]\n단위: 백만원\n\n'+rows.map(([item,a,b])=>{const old=Number(a),now=Number(b);return `${item}: ${old} → ${now} (${now-old>=0?'+':''}${now-old}, ${old?((now-old)/old*100).toFixed(1)+'%':'비교 불가'})`}).join('\n')+'\n\n예산의 적정성·타당성은 판단하지 않았습니다. 실제 근거와 산식은 담당자가 검토해야 합니다.'}}if(current.sub==='petition'){const c=/버스|교통|통학|정류장/.test(prompt)?'교통·안전':/복지|돌봄|시설/.test(prompt)?'복지·생활':'일반 의견';text=`[민원 분류 제안 / 키워드 기반]\n입력: ${prompt}\n\n추천 분류: ${c}\n추천 검토: 내용 확인 후 담당자가 소관 부서를 결정해 주세요.\n\n민원을 자동 배정하거나 실제 접수하지 않았습니다.`}if(current.sub==='media'){const found=state.workItems.filter(w=>w.kind==='media');text='[로컬 홍보자료 검토]\n실시간 언론 검색은 실행하지 않았습니다.\n\n'+found.map(w=>`${w.title}\n${w.body}`).join('\n\n')}if(current.sub==='schedule'){const pairs=[];state.meetings.forEach((m,i)=>state.meetings.slice(i+1).forEach(n=>{if(m.date===n.date&&m.time===n.time)pairs.push(`${m.date} ${m.time}: ${m.title} / ${n.title}`)}));text=`[로컬 일정 점검]\n검사 대상: ${state.meetings.length}개 일정\n\n`+(pairs.length?'동일 날짜·시각이 겹치는 일정:\n'+pairs.join('\n'):'동일 날짜·시각으로 등록된 일정이 없습니다.')+'\n\n종료시간과 이동시간은 점검 대상에 포함하지 않습니다.'}aiPlain=text;html=`<article class="card card-pad"><div class="row between"><h2>검토용 결과</h2><span class="tag amber">AI 미연결 · 미검증</span></div><pre class="chat-answer" style="margin-top:20px">${esc(text)}</pre>${sources.length?`<h3 style="margin-top:24px">확인한 로컬 자료</h3>${sources.map((d,i)=>`<div class="source">[${i+1}] ${btn(esc(d.title),'doc-view',d.id,'text-link')}<small style="display:block">v${d.version} · ${d.date} · 가상 예시</small></div>`).join('')}`:''}<div class="rule"></div><div class="row wrap">${btn('텍스트 내려받기','ai-download','','quiet')}${btn('문서함에 저장','ai-save','','primary')}<span class="spacer"></span><small>이 결과가 도움이 되었나요?</small>${btn('도움 됨','ai-feedback','도움 됨','quiet')}${btn('개선 필요','ai-feedback','개선 필요','quiet')}</div></article>`;aiResult=html;$('#ai-output').innerHTML=html;state.aiHistory.unshift({at:stamp(),module:current.sub,prompt,result:text});state.aiHistory=state.aiHistory.slice(0,20);log('AI 예시 실행',aiModules[current.sub].title);toast('로컬 예시 결과를 만들었습니다. 사실관계를 검토해 주세요.')}

function adminRecord(type,id){const isTerm=type==='term',list=isTerm?state.dictionary:type==='user'?state.users:state.codes;const item=id!==''?isTerm?list[Number(id)]:list.find(x=>x.id===id):null;let fields=isTerm?field('term','표준 용어',item?.term||'')+field('english','영문명',item?.english||'')+field('domain','도메인',item?.domain||'문자(20)')+field('definition','정의',item?.definition||'','textarea'):type==='user'?field('name','이름(가상)',item?.name||'')+field('dept','부서·조직',item?.dept||'')+selectField('role','역할',['작성자','검토자','접수 담당','관리자'],item?.role||'작성자'):field('code','분류 코드',item?.code||'')+field('name','명칭',item?.name||'')+field('group','구분',item?.group||'문서유형');openDialog((item?'편집':'등록')+' · '+({term:'표준 용어',user:'사용자',code:'분류 코드'}[type]),`<div class="form-grid">${fields}</div>`,'저장',()=>{const obj=isTerm?{term:val('term'),english:val('english'),domain:val('domain'),definition:val('definition')}:type==='user'?{id:item?.id||uid('u'),name:val('name'),dept:val('dept'),role:val('role')}:{id:item?.id||uid('c'),code:val('code'),name:val('name'),group:val('group')};if(type==='code'&&list.some(x=>x!==item&&x.code===obj.code)||isTerm&&list.some(x=>x!==item&&x.english===obj.english)){toast('중복된 식별자입니다.');return false}if(item)Object.assign(item,obj);else list.push(obj);log('운영 정보 저장',type);closeDialog();render();toast('저장했습니다.')})}
function qualityCheck(){const issues=[],seen=new Set();state.bills.forEach(b=>{if(!b.title.trim())issues.push(b.id+': 의안명 누락');if(!b.committee)issues.push(b.id+': 위원회 누락');if(seen.has(b.id))issues.push(b.id+': 의안번호 중복');seen.add(b.id)});state.documents.filter(d=>!d.deleted).forEach(d=>{if(d.bill&&!seen.has(d.bill))issues.push(d.title+': 연결 의안 없음')});state.meetings.forEach(m=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(m.date)||Number.isNaN(Date.parse(m.date)))issues.push(m.title+': 일정 날짜 오류')});state.quality={at:stamp(),count:state.bills.length+state.documents.length+state.meetings.length,issues};log('로컬 데이터 품질 점검',issues.length+'개 문제');$('#quality-result').innerHTML=qualityHTML();toast('품질 점검을 완료했습니다.')}
function validatedBackup(s){if(!s||s.schema!==2||!Array.isArray(s.bills)||!s.bills.length||s.bills.length>1000)throw Error('지원하지 않는 백업 형식입니다.');for(const key of ['documents','meetings','workItems','notifications','follows','petitions','users','codes','dictionary','logs','aiHistory'])if(!Array.isArray(s[key]))throw Error('백업 항목이 누락되었습니다: '+key);for(const b of s.bills){if(typeof b.id!=='string'||typeof b.title!=='string'||!Number.isInteger(b.stage)||b.stage<0||b.stage>7||!Array.isArray(b.history)||!Array.isArray(b.versions)||!Array.isArray(b.checks)||!Array.isArray(b.signers))throw Error('의안 레코드 형식이 올바르지 않습니다.');b.content=sanitize(b.content);b.versions.forEach(v=>v.content=sanitize(v.content))}for(const d of s.documents){if(typeof d.title!=='string'||typeof d.text!=='string')throw Error('문서 레코드 형식이 올바르지 않습니다.');if(d.data&&!/^data:(application\/(pdf|octet-stream|vnd\.[^;,]+)|text\/[a-z-]+);base64,[A-Za-z0-9+/=]+$/.test(d.data))throw Error('문서 데이터 형식이 안전하지 않습니다.')}if(!s.prefs||!s.permissions)throw Error('설정 정보가 누락되었습니다.');validateImportedTypes(s);return s}
function validateImportedTypes(s){const id=v=>typeof v==='string'&&/^[A-Za-z0-9_-]{1,100}$/.test(v),date=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&!Number.isNaN(Date.parse(v)),num=v=>Number.isFinite(v)&&v>=0&&v<=1000000;const reject=()=>{throw Error('백업 데이터의 식별자·날짜·숫자 형식이 올바르지 않습니다.')};if(!id(s.selected)||typeof s.role!=='string')reject();for(const b of s.bills){if(!id(b.id)||!date(b.created)||!date(b.updated)||!date(b.due)||typeof b.owner!=='string'||typeof b.committee!=='string'||typeof b.public!=='boolean'||!b.signers.every(x=>typeof x==='string')||b.checks.length!==3||!b.checks.every(x=>typeof x==='boolean'))reject();if(b.notice&&(!date(b.notice.start)||!date(b.notice.end)))reject();if(b.votes&&!Object.values(b.votes).every(num))reject()}for(const d of s.documents){if(!id(d.id)||!date(d.date)||!num(d.version)||!['TXT','MD','CSV','PDF','DOCX','PPTX','XLSX'].includes(d.kind)||typeof d.folder!=='string'||typeof d.owner!=='string'||d.bill&&!id(d.bill))reject();if(d.versions&&!Array.isArray(d.versions))reject();if(d.versions)for(const v of d.versions)if(!num(v.version)||typeof v.text!=='string')reject()}for(const m of s.meetings)if(!id(m.id)||!date(m.date)||typeof m.title!=='string'||typeof m.minutes!=='string'||!/^\d{2}:\d{2}$/.test(m.time)||!num(m.attendance)||!num(m.read))reject();for(const w of s.workItems)if(!id(w.id)||!date(w.due)||typeof w.title!=='string'||typeof w.body!=='string')reject();for(const p of s.petitions)if(!id(p.id)||!date(p.date)||typeof p.title!=='string'||typeof p.body!=='string')reject();if(!s.follows.every(f=>typeof f==='string'))reject();if(s.quality&&(!num(s.quality.count)||!Array.isArray(s.quality.issues)))reject();return true}
async function restoreBackup(file){if(!file)return;try{if(file.size>5*1024*1024)throw Error('백업 파일은 5MB 이하여야 합니다.');const restored=validatedBackup(JSON.parse(await file.text()));openDialog('백업 복원 확인',`<p>의안 ${restored.bills.length}건, 문서 ${restored.documents.length}건, 일정 ${restored.meetings.length}건을 복원합니다.</p><div class="notice amber" style="margin-top:17px">현재 데이터는 JSON 파일로 먼저 내려받고, 선택한 백업으로 교체합니다. 외부 서버에는 전송하지 않습니다.</div>`,'현재 백업 후 복원',()=>{download('의안스튜디오_복원전백업.json',JSON.stringify(state,null,2),'application/json');const previous=state;state=restored;if(!persist()){state=previous;return false}closeDialog();route('dashboard');toast('백업을 복원했습니다.')})}catch(e){toast('복원할 수 없습니다: '+e.message)}}

document.addEventListener('click',async e=>{const target=e.target.closest('button');if(!target)return;try{if(target.dataset.mode){if(target.dataset.mode==='public')route('public/'+publicPage+(publicPage==='detail'?'/'+publicBill:''));else route(current.section+(current.sub?'/'+current.sub:''));return}if(target.dataset.route){if($('#dialog').open)closeDialog();route(target.dataset.route);return}if(target.dataset.public){route('public/'+target.dataset.public);return}if(target.dataset.action)await handleAction(target.dataset.action,target.dataset.value||'',target)}catch(err){console.error(err);toast('처리 중 문제가 발생했습니다. 현재 입력 내용을 확인해 주세요.')}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='editor'||t.closest?.('#editor')){clearTimeout(saveTimer);$('#save-status').textContent='저장 중…';saveTimer=setTimeout(()=>saveEditor(),450)}if(t.dataset.filter==='bills'){query=t.value;$('#bill-results').innerHTML=billRows(filterBills(),current.section==='bills'?'bill-detail':'open-bill');if($('#result-count'))$('#result-count').textContent=filterBills().length+'건'}if(t.dataset.filter==='docs'){docQuery=t.value;$('#document-results').innerHTML=docCards(filteredDocs());$('#doc-count').textContent=filteredDocs().length+'개 문서'}if(t.id==='global-search'){query=t.value;$('#search-results').innerHTML=searchResults(query,$('#search-kind').value)}if(t.id==='command-input')$('#command-results').innerHTML=commandItems(t.value);if(t.id==='log-search')$('#logs-table').innerHTML=logsTable(state.logs.filter(l=>(l.action+l.detail+l.at).includes(t.value)));if(t.id==='public-search')filterPublic()});
function filterPublic(){const q=$('#public-search')?.value||'',s=$('#public-stage')?.value||'all',list=publicBills().filter(b=>(publicPage!=='interests'||b.star)&&(!q||(b.title+b.committee).toLowerCase().includes(q.toLowerCase()))&&(s==='all'||String(b.stage)===s));$('#public-results').innerHTML=publicCards(list)}
document.addEventListener('change',async e=>{const t=e.target;try{if(t.dataset.filter==='stage'){statusFilter=t.value;$('#bill-results').innerHTML=billRows(filterBills(),current.section==='bills'?'bill-detail':'open-bill');if($('#result-count'))$('#result-count').textContent=filterBills().length+'건'}if(t.dataset.filter==='selected'){saveEditor();state.selected=t.value;persist();render()}if(t.dataset.check!==undefined){bill().checks[Number(t.dataset.check)]=t.checked;persist();$('#check-count').textContent=bill().checks.filter(Boolean).length+' / 3';$('#check-progress').style.width=bill().checks.filter(Boolean).length/3*100+'%'}if(t.dataset.pref){state.prefs[t.dataset.pref]=t.checked;persist();toast('알림 시연 설정을 저장했습니다.')}if(t.dataset.permission){state.permissions[t.dataset.permission]=t.checked;log('문서 권한 정책 초안 변경',t.dataset.permission+'='+t.checked);toast('권한 정책 초안을 저장했습니다. 실제 접근통제는 적용하지 않습니다.')}if(t.id==='f-actor'){signatureActor=t.value;signDetail(modalTarget)}if(t.id==='demo-role'){state.role=t.value;persist();render();toast('시연 역할 표시를 바꿨습니다.')}if(t.id==='doc-upload')await uploadDocument(t.files[0]);if(t.id==='backup-upload')await restoreBackup(t.files[0]);if(t.id==='search-kind')$('#search-results').innerHTML=searchResults($('#global-search').value,t.value);if(t.id==='public-stage')filterPublic()}catch(err){console.error(err);toast('입력을 처리할 수 없습니다. 파일 또는 입력 형식을 확인해 주세요.')}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();commandDialog()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&$('#editor')){e.preventDefault();saveEditor(true)}if(e.key==='Enter'&&e.target.id==='global-search'){e.preventDefault();handleAction('search-go','')}if(e.key==='Enter'&&e.target.id==='follow-input'){e.preventDefault();handleAction('follow-add','')}});
document.addEventListener('paste',e=>{if(e.target.closest?.('#editor')){e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))}});
document.addEventListener('mousedown',e=>{if(e.target.closest('.editor-toolbar button'))e.preventDefault()});
window.addEventListener('beforeunload',()=>saveEditor());window.addEventListener('popstate',()=>route(location.hash.slice(1)||'dashboard',true));
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=$('#dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()}});
$('#dialog').addEventListener('cancel',()=>{modalAction=null});
route(location.hash.slice(1)||'dashboard',true);
